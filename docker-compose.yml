services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-home_server}
      POSTGRES_USER: ${POSTGRES_USER:-home_server}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-home_server}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-home_server}:${POSTGRES_PASSWORD:-home_server}@postgres:5432/${POSTGRES_DB:-home_server}
      SYSTEM_DISK_MOUNT: /
      EXTERNAL_DISK_MOUNT: /app/external
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ARIA2_RPC_URL: http://aria2:6800/jsonrpc
      ARIA2_RPC_SECRET: ${ARIA2_RPC_SECRET:?Set ARIA2_RPC_SECRET in .env}
      ARIA2_DOWNLOAD_ROOT: /app/external
      ARIA2_EVENTS_DIR: /app/aria2-events/events
    volumes:
      - ${EXTERNAL_DISK_MOUNT:-./Download/test}:/app/external
      - aria2-events:/app/aria2-events:ro
    depends_on:
      postgres:
        condition: service_healthy
      aria2:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:3001
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

  aria2:
    build:
      context: ./docker/aria2
    environment:
      ARIA2_RPC_SECRET: ${ARIA2_RPC_SECRET:?Set ARIA2_RPC_SECRET in .env}
      DOWNLOAD_DIR: /app/external
    volumes:
      - ${EXTERNAL_DISK_MOUNT:-./Download/test}:/app/external
      - aria2-state:/config
      - aria2-events:/state
    healthcheck:
      test: ["CMD", "/usr/local/bin/aria2-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres-data:
  aria2-state:
  aria2-events:
