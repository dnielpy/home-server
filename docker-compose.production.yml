services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-home_server}
      POSTGRES_USER: ${POSTGRES_USER:-home_server}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-home_server}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    pid: host
    network_mode: host
    environment:
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-home_server}:${POSTGRES_PASSWORD:-home_server}@127.0.0.1:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-home_server}
      SYSTEM_DISK_MOUNT: /host
      EXTERNAL_DISK_MOUNT: /host-external
    volumes:
      - /:/host:ro,rslave
      - ${EXTERNAL_DISK_MOUNT:-/mnt/external}:/host-external:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://host.docker.internal:${API_PORT:-3001}
      PORT: 3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
