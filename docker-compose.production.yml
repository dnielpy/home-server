services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-home_server}
      POSTGRES_USER: ${POSTGRES_USER:-home_server}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    pid: host
    network_mode: host
    environment:
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-home_server}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@127.0.0.1:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-home_server}
      SYSTEM_DISK_MOUNT: /host
      EXTERNAL_DISK_MOUNT: /host-external
      ADMIN_USERNAME: ${ADMIN_USERNAME:-Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      ARIA2_RPC_URL: http://127.0.0.1:${ARIA2_RPC_PORT:-6800}/jsonrpc
      ARIA2_RPC_SECRET: ${ARIA2_RPC_SECRET:?Set ARIA2_RPC_SECRET in .env}
      ARIA2_DOWNLOAD_ROOT: /host-external
      ARIA2_EVENTS_DIR: /app/aria2-events/events
    volumes:
      - /:/host:ro
      - ${EXTERNAL_DISK_MOUNT:-/mnt/external}:/host-external
      - aria2-events:/app/aria2-events:ro
    depends_on:
      postgres:
        condition: service_healthy
      aria2:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://host.docker.internal:${API_PORT:-3001}
      PORT: 3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

  aria2:
    build:
      context: ./docker/aria2
    environment:
      ARIA2_RPC_SECRET: ${ARIA2_RPC_SECRET:?Set ARIA2_RPC_SECRET in .env}
      DOWNLOAD_DIR: /host-external
    # The API creates the shared data directories as root:root. The aria2
    # user gets group 0 so it can write only where those directories grant it access.
    group_add:
      - "0"
    ports:
      - "127.0.0.1:${ARIA2_RPC_PORT:-6800}:6800"
    volumes:
      - ${EXTERNAL_DISK_MOUNT:-/mnt/external}:/host-external
      - aria2-state:/config
      - aria2-events:/state
    healthcheck:
      test: ["CMD", "/usr/local/bin/aria2-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres-data:
  aria2-state:
  aria2-events:
